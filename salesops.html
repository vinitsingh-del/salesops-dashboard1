    html, body, #root { width: 100%; height: 100%; }

    .rules-grid, .rules-list, .audit-summary, .audit-list, .audit-coverage { display: grid; gap: 10px; }

    @media (max-width: 980px) {

      .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }

      .rules-grid, .rules-list, .audit-summary, .audit-list, .audit-coverage { grid-template-columns: 1fr !important; }

const api = async (path, options = {}) => {
  if (!supabaseClient) throw new Error("Supabase client could not load.");

  const body = options.body ? JSON.parse(options.body) : {};
  if (path === "/api/state") {
    const { data, error } = await supabaseClient.from("deals").select("*").order("updated_at", { ascending:false });
    if (error) throw new Error(error.message);
    if (!data?.length) {
      const seedRows = initDeals.map(deal => dealToRow(deal));
      const seeded = await supabaseClient.from("deals").upsert(seedRows, { onConflict:"deal_id" }).select("*").order("updated_at", { ascending:false });
      if (seeded.error) throw new Error(seeded.error.message);
      return { deals:(seeded.data || []).map(dealFromRow), churned:CHURNED };
    }
    return { deals:(data || []).map(dealFromRow), churned:CHURNED };
  }
  if (path === "/api/deals" && method === "POST") {
    const deal = body.deal;
    const { data, error } = await supabaseClient.from("deals").upsert(dealToRow(deal), { onConflict:"deal_id" }).select("*").single();
    if (error) throw new Error(error.message);
    return dealFromRow(data);
  }
  const match = path.match(/^\/api\/deals\/(.+)$/);
  if (match && method === "PATCH") {
    const dealId = decodeURIComponent(match[1]);
    const patch = body.patch || body;
    const fullDeal = body.deal || null;
    const current = await supabaseClient.from("deals").select("*").eq("deal_id", String(dealId)).maybeSingle();
    if (current.error) throw new Error(current.error.message);
    const updated = { ...(dealFromRow(current.data) || fullDeal || {}), ...patch, id:dealId };
    const { data, error } = await supabaseClient.from("deals").upsert(dealToRow(updated), { onConflict:"deal_id" }).select("*").single();
    if (error) throw new Error(error.message);
    return dealFromRow(data);
  }
  if (match && method === "DELETE") {
    const dealId = decodeURIComponent(match[1]);
    const { error } = await supabaseClient.from("deals").delete().eq("deal_id", String(dealId));
    if (error) throw new Error(error.message);
    return { ok:true };
  }
  throw new Error("Unsupported backend route.");
};
const uploadDealFile = async (dealId, kind, file) => {

  const { error } = await supabaseClient.storage.from("deal-documents").upload(path, file, { upsert:true, contentType:file.type || undefined });

};

const systemFailures = d => {

  const documentUploadFailed = ["nda","agreementCopy","refrensInvoice"].some(k => d.docs?.[k]?.error);
  if (!d.actionDate || d.actionDate === "--") addFailure("No next action date", "high", "Add the next action date and owner follow-up before the deal is left unattended.");

  if (agreementComplete(d) && !hasAgreementCopy(d)) addFailure("Agreement copy missing", "high", "Upload the agreement copy or paste the agreement document link.");

  if (inv === "Pending" && isPastDue(d.due)) addFailure("Invoice overdue", "high", "Escalate collections and update the next action date.");

              {l}{k==="a"&&deal.aurg==="urgent"&&<span style={{width:6,height:6,borderRadius:"50%",background:C.r,display:"inline-block",marginLeft:4,verticalAlign:"middle"}}/>}
            </div>
          ))}
        </div>

        {/* Journey Pane */}
        {jtab==="j" && (
          <div style={{position:"relative",paddingLeft:18}}>
            <div style={{position:"absolute",left:5,top:7,bottom:7,width:1.5,background:C.b2}}/>
            {deal.journey.map((s,i)=>{
              const isCur = i===curIdx;
              const dc = s.done?"done":isCur?"cur":"pend";
              return (
                <div key={i} style={{position:"relative",paddingBottom:16,display:"flex",gap:11}}>
                  <div style={{
                    width:12,height:12,borderRadius:"50%",border:`2px solid #000`,position:"absolute",left:-18,top:2,zIndex:1,flexShrink:0,
                    background:s.done||isCur?C.p:"#1c1c1c",
                    boxShadow:s.done?`0 0 6px rgba(168,85,247,.5)`:isCur?`0 0 12px rgba(168,85,247,.8)`:"none"
                  }}/>
                  <div style={{flex:1}}>
                    <div style={{fontSize:11.5,fontWeight:700,color:C.w,display:"flex",alignItems:"center",gap:6}}>
                      {s.s}
                      <span style={{fontSize:8,padding:"2px 6px",borderRadius:6,fontWeight:600,background:s.done?"rgba(34,197,94,.1)":isCur?"rgba(168,85,247,.15)":"rgba(35,35,35,.8)",color:s.done?C.g:isCur?C.p3:"#555"}}>
                        {s.done?"Done":isCur?"In Progress":"Pending"}
                      </span>
                    </div>
                    <div style={{fontSize:9,color:C.w4,marginTop:2}}>{s.d}</div>
                    {s.n&&<div style={{fontSize:10,color:"#666",marginTop:3,lineHeight:1.5}}>{s.n}</div>}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* Invoice Flow Pane */}
        {jtab==="f" && (
          <div>
            {deal.type==="MRR"&&<div style={{background:"rgba(168,85,247,.06)",border:"1px solid rgba(168,85,247,.15)",borderRadius:8,padding:"10px 13px",marginBottom:12,fontSize:11,color:C.w3,lineHeight:1.6}}>
              <strong style={{color:C.p3}}>How MRR invoicing works for {deal.name}:</strong><br/>
              Every month, a fresh invoice is raised on <strong style={{color:C.w}}>Refrens</strong> for the agreed monthly amount. The brand pays within <strong style={{color:C.w}}>15 days</strong>. This repeats for <strong style={{color:C.w}}>{deal.dur}</strong> until renewal.
            </div>}
            {deal.mrrI.length>0?(
              <>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:10}}>
                  <thead>
                    <tr>{["Month","Invoice #","Refrens","Amount","Raised","Due","Paid","Status"].map(h=>(
                      <th key={h} style={{padding:"5px 8px",textAlign:"left",fontSize:7.5,fontWeight:700,color:"#333",textTransform:"uppercase",letterSpacing:.8,borderBottom:`1px solid ${C.b1}`}}>{h}</th>
                    ))}</tr>
                  </thead>
                  <tbody>
                    {deal.mrrI.map((inv,i)=>(
                      <tr key={i} style={{opacity:(inv.st==="Upcoming"||inv.st==="Renewal Due")?.5:1}}>
                        <td style={{padding:"7px 8px",borderBottom:`1px solid rgba(22,22,22,.5)`,fontWeight:600,color:C.w}}>{inv.mo}</td>
                        <td style={{padding:"7px 8px",borderBottom:`1px solid rgba(22,22,22,.5)`,color:"#666",fontSize:9.5}}>{inv.num}</td>
                        <td style={{padding:"7px 8px",borderBottom:`1px solid rgba(22,22,22,.5)`}}><Rtag v={inv.ref}/></td>
                        <td style={{padding:"7px 8px",borderBottom:`1px solid rgba(22,22,22,.5)`,fontWeight:700,color:C.w}}>{inv.amt}</td>
                        <td style={{padding:"7px 8px",borderBottom:`1px solid rgba(22,22,22,.5)`,color:"#777",fontSize:9.5}}>{inv.raised}</td>
                        <td style={{padding:"7px 8px",borderBottom:`1px solid rgba(22,22,22,.5)`,color:inv.st==="Pending"?C.r:"#777",fontSize:9.5}}>{inv.due}</td>
                        <td style={{padding:"7px 8px",borderBottom:`1px solid rgba(22,22,22,.5)`,color:inv.paid!=="--"?C.g:"#444",fontSize:9.5}}>{inv.paid}</td>
                        <td style={{padding:"7px 8px",borderBottom:`1px solid rgba(22,22,22,.5)`,fontWeight:600,fontSize:9.5,color:inv.st==="Paid"?C.g:inv.st==="Pending"?C.y:inv.st==="Upcoming"?"#555":C.r}}>{inv.st}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                {nextI&&<div style={{background:"rgba(168,85,247,.07)",border:"1px solid rgba(168,85,247,.18)",borderRadius:8,padding:"9px 12px",marginTop:9,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div><div style={{fontSize:8.5,color:C.w4,fontWeight:600,textTransform:"uppercase",letterSpacing:.6}}>Next Invoice</div><div style={{fontSize:12.5,fontWeight:700,color:C.p3,marginTop:2}}>{nextI.amt}</div><div style={{fontSize:9,color:C.w4,marginTop:2}}>{nextI.mo} · Raise: {nextI.raised}</div></div>
                  <div style={{textAlign:"right"}}><div style={{fontSize:8.5,color:C.w4,fontWeight:600,textTransform:"uppercase",letterSpacing:.6}}>Status</div><div style={{fontSize:13,fontWeight:700,color:C.r,marginTop:2}}>{nextI.st}</div></div>
                </div>}
              </>
            ):<div style={{textAlign:"center",padding:24,color:C.b3,fontSize:11}}>No invoice history yet</div>}
          </div>
        )}

        {/* Next Action Pane */}
        {jtab==="a" && (
          <div>
            <div style={{background:C.s2,border:`1px solid ${C.b2}`,borderRadius:9,padding:"14px 16px",marginBottom:14}}>
              <div style={{fontSize:9,fontWeight:700,color:"#3a3a3a",textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Current Next Action</div>
              <div style={{fontSize:14,fontWeight:600,color:C.w,marginBottom:5}}>{deal.nextAction||"No action set"}</div>
              <div style={{fontSize:11,color:urgC[deal.aurg||"safe"]}}>Due: {deal.actionDate||"--"}</div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9}}>
              <div style={{gridColumn:"1/-1"}}>
                <div style={{fontSize:8,fontWeight:700,color:"#333",textTransform:"uppercase",letterSpacing:.8,marginBottom:3}}>What needs to be done?</div>
                <input value={actText} onChange={e=>setActText(e.target.value)} placeholder="e.g. Send renewal proposal" style={{width:"100%",background:C.s2,border:`1px solid ${C.b2}`,borderRadius:7,padding:"7px 9px",color:C.w,fontSize:10.5,fontFamily:"'Poppins',sans-serif",outline:"none"}}/>
              </div>
              <div>
                <div style={{fontSize:8,fontWeight:700,color:"#333",textTransform:"uppercase",letterSpacing:.8,marginBottom:3}}>Action Date</div>
                <input value={actDate} onChange={e=>setActDate(e.target.value)} placeholder="e.g. 25 May 2026" style={{width:"100%",background:C.s2,border:`1px solid ${C.b2}`,borderRadius:7,padding:"7px 9px",color:C.w,fontSize:10.5,fontFamily:"'Poppins',sans-serif",outline:"none"}}/>
              </div>
              <div>
                <div style={{fontSize:8,fontWeight:700,color:"#333",textTransform:"uppercase",letterSpacing:.8,marginBottom:3}}>Urgency</div>
                <select value={actUrg} onChange={e=>setActUrg(e.target.value)} style={{width:"100%",background:C.s2,border:`1px solid ${C.b2}`,borderRadius:7,padding:"7px 9px",color:C.w,fontSize:10.5,fontFamily:"'Poppins',sans-serif",outline:"none"}}>
                  <option value="urgent">Urgent (red)</option>
                  <option value="warn">Warning (yellow)</option>
                  <option value="safe">Normal (green)</option>
                </select>
              </div>
            </div>
            <button onClick={()=>{onSaveAction(deal.id,actText,actDate,actUrg);onClose();toast("Action saved for "+deal.name);}} style={{marginTop:12,width:"100%",padding:"8px",borderRadius:7,fontSize:11,fontWeight:600,cursor:"pointer",border:"none",background:`linear-gradient(135deg,${C.p2},${C.p})`,color:C.w,fontFamily:"'Poppins',sans-serif"}}>
              Save Action
            </button>
          </div>
        )}

        {jtab==="risk" && (
          <div>
            <div style={{background:C.s2,border:`1px solid ${C.b2}`,borderRadius:9,padding:"14px 16px",marginBottom:14}}>
              <div style={{fontSize:9,fontWeight:700,color:"#3a3a3a",textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Churn Possibility</div>
              <select value={risk} onChange={e=>setRisk(e.target.value)} style={{width:"100%",background:C.s1,border:`1px solid ${C.b2}`,borderRadius:7,padding:"8px 9px",color:C.w,fontSize:11,fontFamily:"'Poppins',sans-serif",outline:"none"}}>
                {CHURN_RISK_OPTIONS.map(([label,value])=><option key={value} value={value}>{label}</option>)}
              </select>
              <div style={{fontSize:9,fontWeight:700,color:"#3a3a3a",textTransform:"uppercase",letterSpacing:1,margin:"12px 0 5px"}}>Reason / Notes</div>
              <textarea value={riskNotes} onChange={e=>setRiskNotes(e.target.value)} placeholder="Reason for churn risk, blocker, owner update..." style={{width:"100%",minHeight:74,background:C.s1,border:`1px solid ${C.b2}`,borderRadius:7,padding:"8px 9px",color:C.w,fontSize:10.5,fontFamily:"'Poppins',sans-serif",outline:"none",resize:"vertical"}}/>
            </div>
            <button onClick={()=>{onSaveRisk(deal.id,risk,riskNotes);onClose();toast("Churn possibility updated for "+deal.name);}} style={{width:"100%",padding:"8px",borderRadius:7,fontSize:11,fontWeight:600,cursor:"pointer",border:"none",background:`linear-gradient(135deg,${C.p2},${C.p})`,color:C.w,fontFamily:"'Poppins',sans-serif"}}>
              Save Churn Risk
            </button>
          </div>
        )}
      </div>
    </div>
  );
};

    <div style={{padding:"3px 9px 2px",fontSize:7,fontWeight:700,color:"#1e1e1e",textTransform:"uppercase",letterSpacing:1,background:C.s2}}>Churn Possibility</div>
    {CHURN_RISK_OPTIONS.map(([label,value])=>{
      const r = riskStyle(value);
      return <div key={value} onClick={()=>{onChange(value);onClose();}} style={{padding:"6px 9px",fontSize:10,fontWeight:500,cursor:"pointer",display:"flex",alignItems:"center",gap:6,borderBottom:`1px solid rgba(22,22,22,.4)`,color:dealRisk(deal)===value?C.p3:C.w2}}>

// ---- Main Dashboard ----
function App() {
  const [deals, setDeals] = useState([]);
  const [churned, setChurned] = useState([]);
  const [activeTab, setActiveTab] = useState("dash");
  const [gMonth, setGMonth] = useState("all");
  const [journeyDeal, setJourneyDeal] = useState(null);
  const [openMenu, setOpenMenu] = useState(null); // {id, type}
  const [searchQ, setSearchQ] = useState("");
  const [dealFilter, setDealFilter] = useState("all");
  const [renFilter, setRenFilter] = useState("all");
  const [invFilter, setInvFilter] = useState("all");
  const [invMonthF, setInvMonthF] = useState("all");
  const [chFilter, setChFilter] = useState("all");
  const [chMonthF, setChMonthF] = useState("all");
  const [docFilter, setDocFilter] = useState("all");
  const [showAP, setShowAP] = useState(false);
  const [showAdd, setShowAdd] = useState(false);
  const defaultAddForm = {name:"",type:"MRR",val:"",durationMonths:"3",month:"may",stage:"approval",ref:"",invoiceNumber:"",inv:"Pending",sales:"",cam:"",biz:"",ren:"",action:"",adate:"",startDate:"",approvalDate:"",agreementSentDate:"",agreementSigned:"no",agreementSignedDate:"",agreementLink:"",ndaLink:"",proposalLink:"",agreementFile:null,agreementFileName:"",invoiceFile:null,invoiceFileName:"",firstInvoiceRaised:"no",firstInvoiceDate:"",paymentTermDays:"15",clearanceDate:"",firstInvoiceAmount:"",recurringAmount:"",invoiceDay:"1",partialInvoice:"no",churnRisk:"low",churnNotes:""};
  const [addForm, setAddForm] = useState(defaultAddForm);
  const [editActId, setEditActId] = useState(null);
  const [editActText, setEditActText] = useState("");
  const [editActDate, setEditActDate] = useState("");
  const [loading, setLoading] = useState(true);
  const [apiError, setApiError] = useState("");
  const [backendReady, setBackendReady] = useState(false);

  useEffect(()=>{
    let alive = true;
    api("/api/state")
      .then(data=>{
        if(!alive) return;
        setDeals((data.deals || []).map(normalizedDeal));
        setChurned(data.churned || []);
        setApiError("");
        setBackendReady(true);
      })
      .catch(err=>{
        if(!alive) return;
        setDeals([]);
        setChurned([]);
        setBackendReady(false);
        setApiError((err.message || "").includes("deals") ? backendMissingMsg : (err.message || backendMissingMsg));
      })
      .finally(()=>alive && setLoading(false));
    return()=>{alive=false;};
  },[]);

  useEffect(()=>{
    if(!supabaseClient || !backendReady) return;
    const channel = supabaseClient
      .channel("salesops-deals-realtime")
      .on("postgres_changes", {event:"*", schema:"public", table:"deals"}, payload => {
        if(payload.eventType === "DELETE") {
          setDeals(prev=>prev.filter(d=>String(d.id)!==String(payload.old?.deal_id)));
          return;
        }
        const incoming = normalizedDeal(dealFromRow(payload.new));
        setDeals(prev=>{
          const exists = prev.some(d=>String(d.id)===String(incoming.id));
          const next = exists ? prev.map(d=>String(d.id)===String(incoming.id)?incoming:d) : [incoming, ...prev];
          return next;
        });
        setJourneyDeal(prev=>prev && String(prev.id)===String(incoming.id) ? incoming : prev);
      })
      .subscribe(status => {
        if(status === "CHANNEL_ERROR") setApiError("Realtime sync could not start. Enable Supabase Realtime for public.deals, then refresh.");
      });
    return()=>{ supabaseClient.removeChannel(channel); };
  },[backendReady]);

  useEffect(()=>{document.addEventListener("click",()=>setOpenMenu(null));return()=>document.removeEventListener("click",()=>setOpenMenu(null));},[]);

  const persistDealPatch = async (id, patch, successMsg) => {
    const existing = deals.find(d=>String(d.id)===String(id)) || journeyDeal;
    const optimistic = normalizedDeal({...existing,...patch,id:existing?.id ?? id});
    setDeals(prev=>prev.map(d=>String(d.id)!==String(id)?d:optimistic));
    setJourneyDeal(prev=>prev && String(prev.id)===String(id)?optimistic:prev);
    try {
      const saved = await api(`/api/deals/${id}`, {method:"PATCH", body:JSON.stringify({patch,deal:optimistic})});
      const clean = normalizedDeal(saved);
      setDeals(prev=>prev.map(d=>String(d.id)!==String(id)?d:clean));
      setJourneyDeal(prev=>prev && String(prev.id)===String(id)?clean:prev);
      setApiError("");
      if(successMsg) toast(successMsg);
    } catch(err) {
      setApiError(err.message || "Could not save change to backend.");
      setDeals(prev=>prev.map(d=>String(d.id)!==String(id)?d:existing));
      setJourneyDeal(prev=>prev && String(prev.id)===String(id)?existing:prev);
      toast("Not saved to Supabase");
    }
  };

  const getFiltered = () => {
    let list = deals;
    if(gMonth==="q1") list=list.filter(d=>["jan","feb","mar"].includes(d.month));
    else if(gMonth==="q2") list=list.filter(d=>["apr","may","jun"].includes(d.month));
    else if(gMonth!=="all") list=list.filter(d=>d.month===gMonth);
    return list;
  };

  const changeStage = (id, ns) => {
    const deal = deals.find(d=>d.id===id);
    if(!deal) return;
    const sg = STAGES[ns];
    let inv=deal.inv, ip=deal.ip;
    if(ns==="inv-paid"||ns==="active"){inv="Paid";ip=100;}
    if(ns==="inv-raised"&&deal.inv!=="Paid"){inv="Pending";ip=Math.max(Number(deal.ip||0),55);}
    if(ns==="approval"||ns==="agreement"){inv="--";ip=0;}
    persistDealPatch(id, {stage:ns,...sg&&{sl:sg.l},inv,ip}, "Stage updated → "+STAGES[ns].l);
  };
  const changeInv = (id, nv) => {
    const deal = deals.find(d=>d.id===id);
    if(!deal) return;
    let stage=deal.stage;
    if(nv==="Paid") stage=deal.type==="MRR"&&agreementComplete(deal)?"active":"inv-paid";
    if(nv==="Pending"&&stage!=="renewal") stage="inv-raised";
    if(nv==="--"&&stage!=="renewal") stage=deal.agreementSentDate||deal.agr===false?"agreement":"approval";
    persistDealPatch(id, {inv:nv,ip:nv==="Paid"?100:0,stage}, "Invoice → "+(nv==="--"?"Not Raised":nv));
  };
  const saveAction = (id,text,date,urg) => {
    persistDealPatch(id, {nextAction:text,actionDate:date,aurg:urg}, "Action saved");
  };
  const saveRisk = (id, risk, notes = "") => {
    persistDealPatch(id, {churnRisk:risk,churnNotes:notes,aurg:risk==="high"?"urgent":risk==="medium"?"warn":"safe"}, "Churn possibility → "+riskStyle(risk).label);
  };
  const uploadExistingDoc = async (deal, kind, file) => {
    if (!file) return;
    const uploaded = await uploadDealFile(deal.id, kind, file);
    const docs = {...(deal.docs || {})};
    const patch = { docs };
    if (kind === "nda") { docs.nda = uploaded; patch.nda = true; }
    if (kind === "agreement") docs.agreementCopy = uploaded;
    if (kind === "invoice") {
      docs.refrensInvoice = uploaded;
      patch.firstInvoiceRaised = true;
      const inferred = extractRefrensInvoiceNumber(file.name);
      if (inferred && (!deal.inum || deal.inum === "--")) patch.inum = inferred;
    }
    await persistDealPatch(deal.id, patch, `${kind === "invoice" ? "Refrens invoice" : kind === "agreement" ? "Agreement copy" : "NDA"} uploaded`);
  };
  const deleteDeal = async (deal) => {
    if (!window.confirm(`Delete ${deal.name}? This removes the deal from Supabase.`)) return;
    try {
      const paths = dealDocPaths(deal);
      if (paths.length && supabaseClient) await supabaseClient.storage.from("deal-documents").remove(paths);
      await api(`/api/deals/${deal.id}`, {method:"DELETE"});
      setDeals(prev=>prev.filter(d=>d.id!==deal.id));
      setJourneyDeal(null);
      toast("Deal deleted");
    } catch (err) {
      setApiError(err.message || "Could not delete deal.");
      toast("Could not delete deal");
    }
  };
  const saveActInline = (id) => {
    persistDealPatch(id, {nextAction:editActText,actionDate:editActDate}, "Action saved");
    setEditActId(null);
  };
  const addDeal = async () => {
    if(!addForm.name.trim()){toast("Enter brand name");return;}
    if(!addForm.adate){toast("Add next action date");return;}
    if(addForm.agreementSigned === "yes" && !addForm.agreementSignedDate){toast("Add agreement signed date");return;}
    if(addForm.agreementSigned === "yes" && !addForm.agreementLink.trim()){toast("Link signed agreement");return;}
    if(addForm.firstInvoiceRaised === "yes" && !addForm.agreementSentDate){toast("Agreement sent date is required before first invoice");return;}
    if(addForm.firstInvoiceRaised === "yes" && !addForm.firstInvoiceDate){toast("Add first invoice raised date");return;}
    if(addForm.inv === "Paid" && !addForm.clearanceDate){toast("Add invoice clearance date");return;}
    const sh = addForm.name.split(" ").map(w=>w[0]||"").join("").slice(0,3).toUpperCase();
    const cols = [["rgba(168,85,247,.15)","#d8b4fe"],["rgba(34,197,94,.12)","#86efac"],["rgba(59,130,246,.12)","#93c5fd"]];
    const c = cols[deals.length%cols.length];
    const amount = parseAmount(addForm.val);
    const durationMonths = getDurationMonths(addForm);
    const mrrI = buildInvoices(addForm, amount);
    const firstInv = mrrI[0] || {};
    const derivedStage = deriveStageFromForm(addForm);
    const renDate = addForm.ren || (addForm.type === "MRR" && addForm.startDate ? addMonths(addForm.startDate, durationMonths) : "");
    const newId = Date.now();
    const agreementCopy = await uploadDealFile(newId, "agreement", addForm.agreementFile);
    const invoiceCopy = await uploadDealFile(newId, "refrens-invoice", addForm.invoiceFile);
    const newD = {
      id:newId,name:addForm.name,sh,bg:c[0],tc:c[1],type:addForm.type,dur:addForm.type==="MRR"?durationMonths+"mo":"One-Time",durationMonths,amt:amount,af:rupee(amount),stage:derivedStage,

      churnRisk:addForm.churnRisk,churnNotes:addForm.churnNotes,mrrI,
      journey:[

        {s:"Invoice Paid",d:addForm.inv==="Paid"?displayDate(addForm.clearanceDate):"--",done:addForm.inv==="Paid",n:addForm.inv==="Paid"?"Payment cleared":"Payment pending"},

    try {

                        {items.sort((a,b)=>b.amt-a.amt).map(o=>(
                          <div key={o.n} style={{padding:"6px 0",borderBottom:`1px solid ${C.b1}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                            <div><div style={{fontSize:12,fontWeight:600,color:col}}>{o.n}</div><div style={{fontSize:9,color:"#3a3a3a"}}>{o.count} deal{o.count>1?"s":""}</div></div>
                            <span style={{fontWeight:700,color:C.w,fontSize:11}}>Rs.{fmt(o.amt)}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                  <div style={{background:C.s1,border:`1px solid ${C.b1}`,borderRadius:10,overflow:"hidden"}}>
                    <div style={{padding:"10px 14px",borderBottom:`1px solid ${C.b1}`,fontSize:11.5,fontWeight:600}}>Stats</div>
                    <div style={{padding:"9px 12px"}}>
                      {[["Active",deals.filter(d=>canonicalStage(d)==="active").length,C.g],["MRR Deals",deals.filter(d=>d.type==="MRR").length,C.p3],["Renewal Due",deals.filter(d=>canonicalStage(d)==="renewal").length,C.r],["Inv Pending",deals.filter(d=>canonicalInvoice(d)==="Pending").length,C.y],["Churned",churned.length,C.ch]].map(([l,v,col])=>(
                        <div key={l} style={{padding:"5px 0",borderBottom:`1px solid ${C.b1}`,display:"flex",justifyContent:"space-between",fontSize:10.5}}><span style={{color:"#555"}}>{l}</span><span style={{fontWeight:600,color:col}}>{v}</span></div>
                      ))}
                    </div>
                  </div>
                </div>
                <div style={{background:C.s1,border:`1px solid ${C.b1}`,borderRadius:10,overflow:"hidden"}}>
                  <div style={{padding:"10px 14px",borderBottom:`1px solid ${C.b1}`,fontSize:11.5,fontWeight:600}}>Full Table</div>
                  <div style={{overflowX:"auto"}}>
                    <table style={{width:"100%",borderCollapse:"collapse",fontSize:10.5}}>
                      <thead><tr>{["Brand","Sales","CAM","Business Owner","Amount","Stage ▾","Next Action"].map(h=>th(h))}</tr></thead>
                      <tbody>{deals.map(d=>(
                        <tr key={d.id}>
                          {td_(<div style={{display:"flex",alignItems:"center",gap:6}}><Av d={d} size={20} onClick={()=>setJourneyDeal(d)}/><span onClick={()=>setJourneyDeal(d)} style={{fontWeight:600,fontSize:10,color:C.w,cursor:"pointer"}}>{d.name}</span></div>)}
                          {td_(<span style={{fontSize:10.5,fontWeight:600,color:C.p3}}>{d.sales}</span>)}
                          {td_(<span style={{fontSize:10.5,fontWeight:600,color:"#86efac"}}>{d.cam}</span>)}
                          {td_(<span style={{fontSize:10.5,color:"#666"}}>{d.biz}</span>)}
                          {td_(<span style={{fontWeight:700,color:C.w}}>{d.af}</span>)}
                          {td_(
                            <div style={{position:"relative",display:"inline-block"}} onClick={e=>e.stopPropagation()}>
                              <Badge s={canonicalStage(d)}/>
                              <span onClick={e=>{e.stopPropagation();setOpenMenu(openMenu?.id===d.id&&openMenu?.type==="stg"?null:{id:d.id,type:"stg"});}} style={{cursor:"pointer",fontSize:8,opacity:.5,marginLeft:2}}>▾</span>
                              {openMenu?.id===d.id&&openMenu?.type==="stg"&&<StageMenu deal={d} onClose={()=>setOpenMenu(null)} onChange={ns=>changeStage(d.id,ns)}/>}
                            </div>
                          )}
                          {td_(<span style={{fontSize:9.5,color:urgC[d.aurg||"safe"]}}>{d.nextAction||"--"}</span>)}
                        </tr>
                      ))}</tbody>
                    </table>
                  </div>
                </div>
              </div>
            );
          })()}

          {/* ===== RULES ===== */}
          {activeTab==="rules"&&(
            <div>
              <div style={{fontSize:16,fontWeight:700,marginBottom:5}}>SalesOps Rules & Edge Cases</div>
              <div style={{fontSize:10,color:C.w4,marginBottom:12}}>Team training for agreements, documents, deal duration, invoice logic, due dates, next action dates, churn possibility, and failure cases.</div>
              <div className="rules-grid" style={{marginBottom:14}}>
                {[["Agreement Gate","Agreement sent → signed yes/no → document link required before docs complete",C.p3],["Invoice Gate","First invoice raised before invoice paid; recurring invoices generated from duration",C.y],["MRR Activation","MRR becomes Active only after signed agreement and first invoice paid",C.g],["Churn Watch","High-risk brands remain visible before they become churned",C.r]].map(([t,b,col])=>(
                  <div key={t} style={{background:C.s1,border:`1px solid ${C.b1}`,borderRadius:10,padding:13}}>
                    <div style={{fontSize:12,fontWeight:700,color:col,marginBottom:4}}>{t}</div>
                    <div style={{fontSize:10,color:C.w4,lineHeight:1.5}}>{b}</div>
                  </div>
                ))}
              </div>
              <div style={{background:C.s1,border:`1px solid ${C.b1}`,borderRadius:10,overflow:"hidden",marginBottom:14}}>
                <div style={{padding:"10px 14px",borderBottom:`1px solid ${C.b1}`,fontSize:11.5,fontWeight:600}}>14 Operating Rules</div>
                <div className="rules-list" style={{padding:12}}>
                  {RULES.map((r,i)=>(
                    <div key={i} style={{display:"flex",gap:8,background:C.s2,border:`1px solid ${C.b2}`,borderRadius:8,padding:"8px 9px"}}>
                      <div style={{width:20,height:20,borderRadius:6,background:C.pd,color:C.p3,fontSize:9,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{i+1}</div>
                      <div style={{fontSize:10,color:C.w2,lineHeight:1.45}}>{r}</div>
                    </div>
                  ))}
                </div>
              </div>
              {(()=>{
                const auditChecks = ["No next action date","Agreement missing","Agreement copy missing","Invoice paid but invoice not raised","Invoice overdue","Payment marked paid but clearance date missing","First invoice raised before agreement sent","MRR duration missing","MRR invoice schedule missing","Churn Medium/High without reason","Supabase document upload failed"];
                const failures = deals.flatMap(d=>systemFailures(d).map(f=>({deal:d,...f})))
                  .sort((a,b)=>(a.severity==="high"?0:1)-(b.severity==="high"?0:1) || a.deal.name.localeCompare(b.deal.name));
                const high = failures.filter(f=>f.severity==="high").length;
                const medium = failures.filter(f=>f.severity==="medium").length;
                const impacted = new Set(failures.map(f=>f.deal.id)).size;
                const clean = Math.max(0, deals.length - impacted);
                const statCards = [["High Failures",high,C.r],["Medium Warnings",medium,C.y],["Deals Impacted",impacted,C.p3],["Clean Deals",clean,C.g]];
                return <div style={{background:C.s1,border:`1px solid ${C.b1}`,borderRadius:10,overflow:"hidden"}}>
                  <div className="mobile-stack" style={{padding:"12px 14px",borderBottom:`1px solid ${C.b1}`,display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
                    <div>
                      <div style={{fontSize:13,fontWeight:700}}>System Failure Audit</div>
                      <div style={{fontSize:10,color:C.w4,marginTop:3}}>Automatic checks that catch deal flow breaks before finance, CAM, or renewal teams miss them.</div>
                    </div>
                    <span style={{fontSize:9,fontWeight:800,color:high?C.r:medium?C.y:C.g,background:high?"rgba(239,68,68,.1)":medium?"rgba(245,158,11,.12)":"rgba(34,197,94,.1)",border:`1px solid ${high?"rgba(239,68,68,.25)":medium?"rgba(245,158,11,.25)":"rgba(34,197,94,.22)"}`,borderRadius:999,padding:"5px 9px",whiteSpace:"nowrap"}}>{failures.length ? `${failures.length} issues found` : "All clear"}</span>
                  </div>
                  <div style={{padding:14}}>
                    <div className="audit-summary">
                      {statCards.map(([label,value,col])=>(
                        <div key={label} style={{background:C.s2,border:`1px solid ${C.b2}`,borderRadius:10,padding:12}}>
                          <div style={{fontSize:19,fontWeight:800,color:col,lineHeight:1}}>{value}</div>
                          <div style={{fontSize:9.5,color:C.w4,fontWeight:700,textTransform:"uppercase",letterSpacing:.8,marginTop:7}}>{label}</div>
                        </div>
                      ))}
                    </div>
                    <div style={{fontSize:11.5,fontWeight:700,marginBottom:8}}>Audit Coverage</div>
                    <div className="audit-coverage" style={{marginBottom:14}}>
                      {auditChecks.map(check=>{
                        const count = failures.filter(f=>f.type===check).length;
                        const col = count ? C.r : C.g;
                        return <div key={check} style={{display:"flex",alignItems:"center",gap:8,background:C.s2,border:`1px solid ${count?"rgba(239,68,68,.25)":C.b2}`,borderRadius:8,padding:"8px 9px"}}>
                          <span style={{width:18,height:18,borderRadius:6,background:count?"rgba(239,68,68,.12)":"rgba(34,197,94,.1)",color:col,fontSize:11,fontWeight:900,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{count || "✓"}</span>
                          <span style={{fontSize:10,color:C.w2,lineHeight:1.35,fontWeight:600}}>{check}</span>
                        </div>;
                      })}
                    </div>
                    <div style={{fontSize:11.5,fontWeight:700,marginBottom:8}}>Broken Flow Items</div>
                    {failures.length===0 ? (
                      <div style={{background:"rgba(34,197,94,.08)",border:"1px solid rgba(34,197,94,.22)",borderRadius:10,padding:14}}>
                        <div style={{fontSize:12,fontWeight:800,color:C.g}}>No flow breaks detected</div>
                        <div style={{fontSize:10,color:C.w3,marginTop:4}}>Every active deal has the required dates, documents, invoice sequence, and churn notes.</div>
                      </div>
                    ) : (
                      <div className="audit-list">
                        {failures.map((f,i)=>{
                          const col = f.severity==="high"?C.r:C.y;
                          return <div key={f.deal.id+"-"+i} style={{background:C.s2,border:`1px solid ${f.severity==="high"?"rgba(239,68,68,.25)":"rgba(245,158,11,.25)"}`,borderRadius:10,padding:12}}>
                            <div className="mobile-stack" style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,marginBottom:9}}>
                              <div style={{display:"flex",alignItems:"center",gap:8,minWidth:0}}>
                                <Av d={f.deal} size={28} onClick={()=>setJourneyDeal(f.deal)}/>
                                <div style={{minWidth:0}}>
                                  <div onClick={()=>setJourneyDeal(f.deal)} style={{fontSize:12,fontWeight:800,color:C.w,cursor:"pointer",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{f.deal.name}</div>
                                  <div style={{fontSize:9.5,color:C.w4,marginTop:2}}>{f.deal.sales||"--"} · {f.deal.cam||"--"}</div>
                                </div>
                              </div>
                              <span style={{fontSize:8.5,fontWeight:900,textTransform:"uppercase",letterSpacing:.8,color:col,background:f.severity==="high"?"rgba(239,68,68,.12)":"rgba(245,158,11,.12)",border:`1px solid ${f.severity==="high"?"rgba(239,68,68,.25)":"rgba(245,158,11,.25)"}`,borderRadius:999,padding:"4px 8px",whiteSpace:"nowrap"}}>{f.severity}</span>
                            </div>
                            <div style={{fontSize:12,fontWeight:800,color:col,marginBottom:5}}>{f.type}</div>
                            <div style={{fontSize:10.5,color:C.w3,lineHeight:1.5,marginBottom:10}}>{f.fix}</div>
                            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                              <div style={{background:C.bg,border:`1px solid ${C.b1}`,borderRadius:8,padding:8}}>
                                <div style={{fontSize:8,color:C.w4,fontWeight:800,textTransform:"uppercase",letterSpacing:.7}}>Next Action</div>
                                <div style={{fontSize:10,color:f.deal.nextAction?C.w2:C.r,fontWeight:600,marginTop:3}}>{f.deal.nextAction||"Set next action"}</div>
                              </div>
                              <div style={{background:C.bg,border:`1px solid ${C.b1}`,borderRadius:8,padding:8}}>
                                <div style={{fontSize:8,color:C.w4,fontWeight:800,textTransform:"uppercase",letterSpacing:.7}}>Action Date</div>
                                <div style={{fontSize:10,color:f.deal.actionDate&&f.deal.actionDate!=="--"?C.w2:C.r,fontWeight:600,marginTop:3}}>{f.deal.actionDate||"--"}</div>
                              </div>
                            </div>
                          </div>;
                        })}
                      </div>
                    )}
                  </div>
                </div>;
              })()}
            </div>
          )}

        </div>
      </main>

      {/* JOURNEY MODAL */}
      {journeyDeal&&<JourneyModal deal={journeyDeal} onClose={()=>setJourneyDeal(null)} onSaveAction={saveAction} onSaveRisk={saveRisk}/>}

      {/* ADD DEAL MODAL */}
      {showAdd&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.92)",zIndex:900,display:"flex",alignItems:"center",justifyContent:"center",backdropFilter:"blur(6px)"}} onClick={e=>e.target===e.currentTarget&&setShowAdd(false)}>
          <div className="add-modal" style={{background:C.s1,border:`1px solid ${C.b2}`,borderRadius:13,maxHeight:"90vh",overflowY:"auto",padding:20}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
              <span style={{fontSize:14,fontWeight:700}}>Add New Deal</span>
              <div onClick={()=>setShowAdd(false)} style={{width:24,height:24,borderRadius:6,background:C.s2,border:`1px solid ${C.b2}`,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:C.w4,fontSize:12}}>✕</div>
            </div>
            <div className="form-grid">
              {[["Brand Name","text","name","e.g. Nykaa"],["Value (Rs.)","number","val","150000"],["Refrens ID","text","ref","REF-XXX-0000"],["Sales / BDM","text","sales","Name"],["CAM Owner","text","cam","Name"],["Business Owner","text","biz","POC"],["Agreement Link","url","agreementLink","https://..."],["NDA Link","url","ndaLink","https://..."],["Proposal Link","url","proposalLink","https://..."],["First Invoice #","text","invoiceNumber","#INV-0001"],["First Invoice Amount","number","firstInvoiceAmount","Optional"],["Recurring Amount","number","recurringAmount","Optional"],["Next Action","text","action","e.g. Send agreement"],["Churn Notes","text","churnNotes","Risk reason"]].map(([l,t,k,ph])=>(
                <div key={k}>
                  <div style={{fontSize:8,fontWeight:700,color:"#333",textTransform:"uppercase",letterSpacing:.8,marginBottom:3}}>{l}</div>
                  <input type={t} value={addForm[k]} onChange={e=>setAddForm({...addForm,[k]:e.target.value})} placeholder={ph} style={{width:"100%",background:C.s2,border:`1px solid ${C.b2}`,borderRadius:7,padding:"7px 9px",color:C.w,fontSize:10.5,fontFamily:"'Poppins',sans-serif",outline:"none"}}/>
                </div>
              ))}
              {[["Start Date","startDate"],["Approval Date","approvalDate"],["Agreement Sent Date","agreementSentDate"],["Agreement Signed Date","agreementSignedDate"],["First Invoice Date","firstInvoiceDate"],["Payment Clearance Date","clearanceDate"],["Renewal Date","ren"],["Next Action Date","adate"]].map(([l,k])=>(
                <div key={k}>
                  <div style={{fontSize:8,fontWeight:700,color:"#333",textTransform:"uppercase",letterSpacing:.8,marginBottom:3}}>{l}</div>
                  <input type="date" value={addForm[k]} onChange={e=>setAddForm({...addForm,[k]:e.target.value})} style={{width:"100%",background:C.s2,border:`1px solid ${C.b2}`,borderRadius:7,padding:"7px 9px",color:C.w,fontSize:10.5,fontFamily:"'Poppins',sans-serif",outline:"none"}}/>
                </div>
              ))}
              {[["Deal Type","type",[["MRR","MRR"],["One-Time","onetime"]]],["Deal Duration","durationMonths",DEAL_DURATIONS.map(([l,v])=>[l,String(v)])],["Month","month",MONTHS.map(m=>[m.charAt(0).toUpperCase()+m.slice(1),m])],["Stage","stage",Object.entries(STAGES).map(([k,v])=>[v.l,k])],["Invoice Status","inv",[["Pending","Pending"],["Paid","Paid"],["Not Raised","--"]]],["Agreement Signed","agreementSigned",[["No","no"],["Yes","yes"]]],["First Invoice Raised","firstInvoiceRaised",[["No","no"],["Yes","yes"]]],["Payment Terms","paymentTermDays",PAYMENT_TERMS.map(([l,v])=>[l,String(v)])],["Partial Invoice","partialInvoice",[["No","no"],["Yes","yes"]]],["Invoice Day","invoiceDay",Array.from({length:28},(_,i)=>[String(i+1),String(i+1)])],["Churn Possibility","churnRisk",CHURN_RISK_OPTIONS]].map(([l,k,opts])=>(
                <div key={k}>
                  <div style={{fontSize:8,fontWeight:700,color:"#333",textTransform:"uppercase",letterSpacing:.8,marginBottom:3}}>{l}</div>
                  <select value={addForm[k]} onChange={e=>setAddForm({...addForm,[k]:e.target.value})} style={{width:"100%",background:C.s2,border:`1px solid ${C.b2}`,borderRadius:7,padding:"7px 9px",color:C.w,fontSize:10.5,fontFamily:"'Poppins',sans-serif",outline:"none"}}>
                    {opts.map(([ol,ov])=><option key={ov} value={ov}>{ol}</option>)}
                  </select>
                </div>
              ))}
              <div>
                <div style={{fontSize:8,fontWeight:700,color:"#333",textTransform:"uppercase",letterSpacing:.8,marginBottom:3}}>Agreement Copy</div>
                <input type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" onChange={e=>{const file=e.target.files?.[0]||null;setAddForm({...addForm,agreementFile:file,agreementFileName:file?.name||""});}} style={{width:"100%",background:C.s2,border:`1px solid ${C.b2}`,borderRadius:7,padding:"6px 7px",color:C.w,fontSize:9.5,fontFamily:"'Poppins',sans-serif",outline:"none"}}/>
                {addForm.agreementFileName&&<div style={{fontSize:8.5,color:C.g,marginTop:3}}>{addForm.agreementFileName}</div>}
              </div>
              <div>
                <div style={{fontSize:8,fontWeight:700,color:"#333",textTransform:"uppercase",letterSpacing:.8,marginBottom:3}}>Refrens Invoice Copy</div>
                <input type="file" accept=".pdf,.jpg,.jpeg,.png" onChange={e=>{const file=e.target.files?.[0]||null;const fileName=file?.name||"";const inferred=extractRefrensInvoiceNumber(fileName);setAddForm({...addForm,invoiceFile:file,invoiceFileName:fileName,invoiceNumber:addForm.invoiceNumber||inferred,firstInvoiceRaised:fileName?"yes":addForm.firstInvoiceRaised});}} style={{width:"100%",background:C.s2,border:`1px solid ${C.b2}`,borderRadius:7,padding:"6px 7px",color:C.w,fontSize:9.5,fontFamily:"'Poppins',sans-serif",outline:"none"}}/>
                {addForm.invoiceFileName&&<div style={{fontSize:8.5,color:C.g,marginTop:3}}>Auto invoice #: {addForm.invoiceNumber||"not detected"}</div>}
              </div>
            </div>
            <div style={{background:C.s2,border:`1px solid ${C.b2}`,borderRadius:8,padding:10,marginTop:12,fontSize:10,color:C.w4,lineHeight:1.5}}>
              Rule preview: {addForm.type==="MRR"?"MRR will create "+getDurationMonths(addForm)+" invoice row(s). First invoice may be partial; recurring invoices follow invoice day "+addForm.invoiceDay+".":"One-time creates one invoice only."} Due date = raised date + payment terms. MRR becomes Active after signed agreement and first payment.
            </div>
            <div style={{display:"flex",gap:6,marginTop:14}}>
              <button onClick={addDeal} style={{flex:1,padding:"8px",borderRadius:7,fontSize:11,fontWeight:600,cursor:"pointer",border:"none",background:`linear-gradient(135deg,${C.p2},${C.p})`,color:C.w,fontFamily:"'Poppins',sans-serif"}}>Save Deal</button>
              <Btn label="Cancel" onClick={()=>setShowAdd(false)}/>
            </div>
          </div>
        </div>
      )}

      {apiError&&<div style={{position:"fixed",bottom:14,left:220,background:"rgba(239,68,68,.12)",border:"1px solid rgba(239,68,68,.35)",borderRadius:8,padding:"9px 13px",fontSize:11,color:"#fca5a5",zIndex:9998,maxWidth:360}}>{apiError}</div>}
      <Toast/>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

  
  </script>
</body>
</html>
